<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>다나 공부 · 수능 D-day</title>
<style>
  :root{
    --bg:#f4f2ec; --card:#ffffff; --ink:#1b1a17; --soft:#6a675f; --line:#e0dcd0;
    --accent:#2f6f5e; --accent-ink:#ffffff; --accent-soft:#e3efe9;
    --ok:#1f7a4d; --ok-bg:#e2f3e8; --no:#b3402a; --no-bg:#fae6e1;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171a; --card:#1e2327; --ink:#ecebe6; --soft:#9aa0a3; --line:#30373c;
      --accent:#5fb79d; --accent-ink:#0f1a16; --accent-soft:#22332e;
      --ok:#6fd09a; --ok-bg:#1c3327; --no:#f08b74; --no-bg:#3a221d;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px; margin:0 auto; padding:20px 16px 60px;}
  header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px;}
  h1{font-size:22px; margin:0; letter-spacing:-0.02em;}
  .today{font-size:13px; color:var(--soft); font-variant-numeric:tabular-nums;}
  .tabs{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:10px;}
  .tabs button, .modes button{
    font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:10px; padding:10px 4px; cursor:pointer;
  }
  .tabs button{font-weight:700; font-size:16px;}
  .tabs button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .modes{display:flex; gap:6px; margin-bottom:14px;}
  .modes button{flex:1; font-size:14px; padding:8px 4px;}
  .modes button[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:700;}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px 18px;}
  .meta{display:flex; justify-content:space-between; font-size:13px; color:var(--soft); margin-bottom:12px; font-variant-numeric:tabular-nums;}
  .tag{color:var(--accent); font-weight:700;}
  .q{font-size:19px; font-weight:600; margin:0 0 18px; word-break:keep-all; line-height:1.7;}
  .q .big{display:block; font-size:34px; font-weight:700; margin:6px 0; letter-spacing:0.04em;}
  .q sup{font-size:0.65em;}
  .choices{display:grid; gap:8px;}
  .choices button{
    font:inherit; font-size:16px; text-align:left; border:1px solid var(--line); background:var(--bg); color:var(--ink);
    border-radius:12px; padding:13px 14px; cursor:pointer; word-break:keep-all;
  }
  .choices button:disabled{cursor:default; opacity:1;}
  .choices button.ok{background:var(--ok-bg); border-color:var(--ok); color:var(--ok); font-weight:700;}
  .choices button.no{background:var(--no-bg); border-color:var(--no); color:var(--no);}
  .explain{margin-top:14px; padding:12px 14px; border-radius:12px; background:var(--accent-soft); font-size:15px; word-break:keep-all;}
  .explain b{color:var(--accent);}
  .next{
    margin-top:14px; width:100%; font:inherit; font-size:16px; font-weight:700; border:0; border-radius:12px;
    padding:14px; background:var(--accent); color:var(--accent-ink); cursor:pointer;
  }
  .flash{min-height:210px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; cursor:pointer; user-select:none;}
  .flash .front{font-size:34px; font-weight:700; letter-spacing:0.02em;}
  .flash .back{font-size:18px; margin-top:14px; word-break:keep-all;}
  .flash .hint{font-size:13px; color:var(--soft); margin-top:16px;}
  .row{display:flex; gap:8px; margin-top:14px;}
  .row button{flex:1; font:inherit; font-size:15px; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:12px; padding:12px; cursor:pointer;}
  .empty{text-align:center; color:var(--soft); padding:40px 0;}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:14px;}
  .stats div{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 4px; text-align:center; font-size:12px; color:var(--soft);}
  .stats strong{display:block; font-size:17px; color:var(--ink); font-variant-numeric:tabular-nums;}
  .reset{display:block; margin:18px auto 0; font:inherit; font-size:12px; color:var(--soft); background:none; border:0; text-decoration:underline; cursor:pointer;}
  .dday{background:var(--accent); color:var(--accent-ink); border-radius:16px; padding:18px; margin-bottom:10px;}
  .dday .top{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .dday .d{font-size:40px; font-weight:800; letter-spacing:-0.02em; line-height:1.1; font-variant-numeric:tabular-nums;}
  .dday .lbl{font-size:13px; opacity:.9; text-align:right;}
  .dday .bar{height:6px; border-radius:3px; background:rgba(255,255,255,.3); margin-top:14px; overflow:hidden;}
  .dday .bar i{display:block; height:100%; background:currentColor; border-radius:3px;}
  .dday .sub{display:flex; justify-content:space-between; font-size:12px; opacity:.9; margin-top:6px; font-variant-numeric:tabular-nums;}
  .views{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:14px;}
  .views button{font:inherit; font-size:16px; font-weight:700; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:11px 4px; cursor:pointer;}
  .views button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .box{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:10px;}
  .box h2{font-size:16px; margin:0 0 2px; letter-spacing:-0.01em;}
  .box .when{font-size:13px; color:var(--soft); font-variant-numeric:tabular-nums;}
  .box .goal{font-size:14px; margin:8px 0 4px; word-break:keep-all;}
  .box.now{border-color:var(--accent); border-width:2px;}
  .box.past{opacity:.6;}
  .badge{display:inline-block; font-size:11px; font-weight:700; background:var(--accent); color:var(--accent-ink); border-radius:6px; padding:1px 7px; margin-left:6px; vertical-align:2px;}
  .head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; cursor:pointer;}
  .cnt{font-size:13px; color:var(--soft); white-space:nowrap; font-variant-numeric:tabular-nums; padding-top:2px;}
  .todo{list-style:none; margin:8px 0 0; padding:0;}
  .todo label{display:flex; gap:10px; align-items:flex-start; padding:7px 0; font-size:15px; cursor:pointer; word-break:keep-all; border-top:1px solid var(--line);}
  .todo input{width:20px; height:20px; margin:2px 0 0; flex:none; accent-color:var(--accent);}
  .todo input:checked + span{color:var(--soft); text-decoration:line-through;}
  .todo b{color:var(--accent); font-weight:700;}
  .examset{font-size:13px; color:var(--soft); margin:14px 2px 0; word-break:keep-all;}
  .examset input{font:inherit; font-size:14px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); margin-top:6px;}
  [hidden]{display:none !important;}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>다나 공부</h1>
    <div class="today" id="today"></div>
  </header>
  <div class="dday" id="dday"></div>
  <div class="views" id="views"></div>
  <section id="plan"></section>
  <section id="study" hidden>
    <div class="tabs" id="tabs"></div>
    <div class="modes" id="modes"></div>
    <div class="panel" id="panel"></div>
    <div class="stats" id="stats"></div>
    <button class="reset" id="reset">문제 기록 지우기</button>
  </section>
</div>

<script>
(function(){
'use strict';

/* ---------- 도구 ---------- */
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(arr){return arr[ri(0,arr.length-1)];}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=ri(0,i);var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(n){return n<0?'−'+(-n):''+n;}
function sup(s){return '<sup>'+s+'</sup>';}
function sub(s){return '<sub>'+s+'</sub>';}
function poly(terms){
  var s='';
  terms.forEach(function(t){
    var c=t[0],p=t[1]; if(c===0) return;
    var abs=Math.abs(c);
    var body=((abs===1&&p>0)?'':abs)+(p>0?'x'+(p>1?sup(p):''):'');
    s+= s ? (c<0?' − ':' + ')+body : (c<0?'−':'')+body;
  });
  return s||'0';
}
/* 보기 만들기: 정답과 오답 후보에서 4지선다 */
function mc(tag,q,answer,wrongs,ex){
  var seen={}; seen[answer]=1; var ws=[];
  shuffle(wrongs).forEach(function(w){ if(!seen[w]&&ws.length<3){seen[w]=1;ws.push(w);} });
  var choices=shuffle([answer].concat(ws));
  return {tag:tag,q:q,choices:choices,a:choices.indexOf(answer),ex:ex||''};
}
function numMc(tag,q,ans,ex,extra){
  var cand=(extra||[]).slice();
  [1,-1,2,-2,3,-3,5,-5,10,-10].forEach(function(d){cand.push(ans+d);});
  cand.push(-ans); cand.push(ans*2);
  cand=cand.filter(function(v){return v!==ans;});
  return mc(tag,q,fmt(ans),cand.map(fmt),ex);
}

/* ---------- 수학 (대수·미적분Ⅰ) ---------- */
var TRIG={
  ang:[[30,'π/6'],[45,'π/4'],[60,'π/3'],[120,'2π/3'],[135,'3π/4'],[150,'5π/6']],
  sin:['1/2','√2/2','√3/2','√3/2','√2/2','1/2'],
  cos:['√3/2','√2/2','1/2','−1/2','−√2/2','−√3/2'],
  tan:['√3/3','1','√3','−√3','−1','−√3/3'],
  pool:['1/2','−1/2','√2/2','−√2/2','√3/2','−√3/2','√3/3','−√3/3','√3','−√3','1','−1','0']
};
var POW=[[8,'2/3',4],[27,'2/3',9],[16,'3/4',8],[4,'3/2',8],[9,'3/2',27],[32,'2/5',4],[81,'3/4',27],[25,'3/2',125],[16,'5/4',32],[64,'2/3',16]];
var MATH=[
  function(){ var p=pick(POW);
    return numMc('지수',p[0]+sup(p[1])+' 의 값은?',p[2],'밑을 거듭제곱 꼴로 고친 뒤 지수끼리 곱합니다. (a'+sup('m')+')'+sup('n')+' = a'+sup('mn')); },
  function(){ var b=pick([2,3]),m=ri(1,4),n=ri(1,4);
    return numMc('로그','log'+sub(b)+' '+Math.pow(b,m)+' + log'+sub(b)+' '+Math.pow(b,n)+' 의 값은?',m+n,
      'log'+sub(b)+' '+Math.pow(b,m)+' = '+m+', log'+sub(b)+' '+Math.pow(b,n)+' = '+n+' 이므로 합은 '+(m+n)+'.'); },
  function(){ var b=pick([2,3]),m=ri(2,4),k=pick([2,3,5,7].filter(function(v){return v!==b;}));
    return numMc('로그','log'+sub(b)+' '+(Math.pow(b,m)*k)+' − log'+sub(b)+' '+k+' 의 값은?',m,
      '로그의 뺄셈은 진수의 나눗셈: log'+sub(b)+' ('+(Math.pow(b,m)*k)+' ÷ '+k+') = log'+sub(b)+' '+Math.pow(b,m)+' = '+m+'.'); },
  function(){ var i=ri(0,5),f=pick(['sin','cos','tan']),rad=Math.random()<0.5;
    var a=TRIG.ang[i], ans=TRIG[f][i];
    return mc('삼각함수',f+' '+(rad?a[1]:a[0]+'°')+' 의 값은?',ans,TRIG.pool,
      (rad?a[1]+' = '+a[0]+'°. ':'')+'특수각 값과 사분면별 부호(1사분면 모두 +, 2사분면 sin만 +)를 함께 기억하세요.'); },
  function(){ var a=ri(-5,9),d=ri(2,6),n=ri(8,20),ans=a+(n-1)*d;
    return numMc('등차수열','첫째항이 '+fmt(a)+', 공차가 '+d+'인 등차수열의 제'+n+'항은?',ans,
      'a'+sub('n')+' = a + (n−1)d = '+fmt(a)+' + '+(n-1)+'×'+d+' = '+fmt(ans)+'.',[a+n*d,a+(n-2)*d]); },
  function(){ var a=ri(1,9),d=ri(2,5),n=10,ans=n*(2*a+(n-1)*d)/2;
    return numMc('등차수열','첫째항이 '+a+', 공차가 '+d+'인 등차수열의 첫째항부터 제10항까지의 합은?',ans,
      'S'+sub('n')+' = n{2a + (n−1)d}/2 = 10×('+(2*a)+' + 9×'+d+')/2 = '+ans+'.',[n*(2*a+n*d)/2,n*(a+(n-1)*d)]); },
  function(){ var a=ri(1,3),r=pick([2,3,-2]),n=ri(4,6),ans=a*Math.pow(r,n-1);
    return numMc('등비수열','첫째항이 '+a+', 공비가 '+fmt(r)+'인 등비수열의 제'+n+'항은?',ans,
      'a'+sub('n')+' = a·r'+sup('n−1')+' = '+a+'×('+fmt(r)+')'+sup(n-1)+' = '+fmt(ans)+'.',[a*Math.pow(r,n),a*Math.pow(r,n-2)]); },
  function(){ var a=ri(2,4),b=ri(1,5),n=ri(5,10),ans=a*n*(n+1)/2+b*n;
    return numMc('수열의 합','Σ'+sub('k=1')+sup(n)+' ('+a+'k + '+b+') 의 값은?',ans,
      'Σk = n(n+1)/2 = '+(n*(n+1)/2)+' 이므로 '+a+'×'+(n*(n+1)/2)+' + '+b+'×'+n+' = '+ans+'.',[a*n*(n+1)/2+b,a*n*(n+1)/2]); },
  function(){ var n=ri(3,10),ans=n*(n+1)*(2*n+1)/6;
    return numMc('수열의 합','Σ'+sub('k=1')+sup(n)+' k'+sup(2)+' 의 값은?',ans,
      'Σk'+sup(2)+' = n(n+1)(2n+1)/6 = '+n+'×'+(n+1)+'×'+(2*n+1)+'/6 = '+ans+'.',[n*(n+1)/2,Math.pow(n*(n+1)/2,2)]); },
  function(){ var a=ri(2,9);
    return numMc('함수의 극한','lim'+sub('x→'+a)+' (x'+sup(2)+' − '+(a*a)+') / (x − '+a+') 의 값은?',2*a,
      '분자를 (x − '+a+')(x + '+a+')로 인수분해하고 약분하면 x + '+a+' → '+(2*a)+'.',[a,a*a,0]); },
  function(){ var q=ri(2,4),m=ri(2,5),p=q*m,b=ri(1,9),c=ri(1,9);
    return numMc('함수의 극한','lim'+sub('x→∞')+' ('+p+'x'+sup(2)+' + '+b+'x) / ('+q+'x'+sup(2)+' − '+c+') 의 값은?',m,
      '분자·분모의 차수가 같으면 최고차항 계수의 비: '+p+'/'+q+' = '+m+'.',[p,q,0]); },
  function(){ var a=ri(1,3),b=ri(-4,4),c=ri(-5,5),k=pick([-2,-1,1,2,3]),ans=3*a*k*k+2*b*k+c;
    return numMc('미분','f(x) = '+poly([[a,3],[b,2],[c,1]])+' 일 때, f′('+fmt(k)+') 의 값은?',ans,
      'f′(x) = '+poly([[3*a,2],[2*b,1],[c,0]])+' 에 x = '+fmt(k)+' 대입 → '+fmt(ans)+'.',[a*k*k*k+b*k*k+c*k]); },
  function(){ var a=ri(1,3),c=ri(-5,5),mx=Math.random()<0.5,ans=(mx?2:-2)*a*a*a+c;
    return numMc('도함수의 활용','f(x) = '+poly([[1,3],[-3*a*a,1],[c,0]])+' 의 '+(mx?'극댓값':'극솟값')+'은?',ans,
      'f′(x) = 3x'+sup(2)+' − '+(3*a*a)+' = 0 에서 x = ±'+a+'. x = −'+a+'에서 극대, x = '+a+'에서 극소. '+(mx?'f(−'+a+')':'f('+a+')')+' = '+fmt(ans)+'.',
      [(mx?-2:2)*a*a*a+c,c]); },
  function(){ var a=ri(1,2),b=ri(-3,3),c=ri(-4,6),k=ri(1,3),ans=a*k*k*k+b*k*k+c*k;
    return numMc('적분','∫'+sub('0')+sup(k)+' ('+poly([[3*a,2],[2*b,1],[c,0]])+') dx 의 값은?',ans,
      '부정적분은 '+poly([[a,3],[b,2],[c,1]])+'. x = '+k+' 을 대입한 값에서 x = 0 을 대입한 값(0)을 빼면 '+fmt(ans)+'.',
      [3*a*k*k+2*b*k+c]); }
];
function genMath(){return pick(MATH)();}

/* ---------- 영어 (수능 어휘) ---------- */
var EN=[
['abandon','버리다, 포기하다'],['abstract','추상적인'],['abundant','풍부한'],['accumulate','축적하다'],
['acknowledge','인정하다'],['adequate','충분한, 적절한'],['advocate','옹호하다; 지지자'],['alter','바꾸다, 고치다'],
['ambiguous','모호한'],['anticipate','예상하다'],['apparent','명백한'],['arbitrary','임의의, 제멋대로인'],
['assess','평가하다'],['attribute','~의 탓(덕)으로 돌리다; 속성'],['bias','편견'],['coherent','논리 정연한, 일관성 있는'],
['coincide','동시에 일어나다, 일치하다'],['compensate','보상하다'],['comprehensive','포괄적인'],['conceive','생각해 내다, 상상하다'],
['constrain','제약하다'],['contradict','모순되다, 반박하다'],['controversial','논란이 많은'],['conventional','관습적인, 전통적인'],
['deliberate','의도적인, 신중한'],['demonstrate','입증하다, 보여 주다'],['deprive','빼앗다'],['derive','끌어내다, 유래하다'],
['diminish','줄어들다, 줄이다'],['distinguish','구별하다'],['diverse','다양한'],['eliminate','제거하다'],
['emerge','나타나다'],['enhance','향상시키다'],['exaggerate','과장하다'],['exclude','제외하다'],
['facilitate','촉진하다, 쉽게 하다'],['fundamental','근본적인'],['hypothesis','가설'],['implication','함축, 영향'],
['inevitable','피할 수 없는'],['inherent','내재하는, 타고난'],['integrate','통합하다'],['interpret','해석하다'],
['justify','정당화하다'],['maintain','유지하다, 주장하다'],['neglect','소홀히 하다, 방치하다'],['notion','개념, 생각'],
['objective','객관적인; 목표'],['obstacle','장애물'],['perceive','인지하다'],['persist','지속하다, 고집하다'],
['phenomenon','현상'],['plausible','그럴듯한'],['precede','앞서다, 선행하다'],['prevail','우세하다, 널리 퍼지다'],
['reinforce','강화하다'],['reluctant','꺼리는, 마지못한'],['scarce','부족한, 드문'],['subsequent','그다음의, 이후의'],
['substitute','대체하다; 대체물'],['suppress','억누르다, 진압하다'],['undermine','약화시키다'],['vulnerable','취약한'],
['withdraw','철회하다, 인출하다']
];
function genEn(){
  var w=pick(EN), rev=Math.random()<0.35;
  var others=EN.filter(function(x){return x!==w;});
  if(rev) return mc('뜻 → 단어','<span class="big" style="font-size:22px">'+w[1]+'</span>에 해당하는 단어는?',w[0],others.map(function(x){return x[0];}),w[0]+' : '+w[1]);
  return mc('단어 → 뜻','<span class="big">'+w[0]+'</span>의 뜻은?',w[1],others.map(function(x){return x[1];}),w[0]+' : '+w[1]);
}

/* ---------- 국어 (맞춤법·문법·문학 개념) ---------- */

function genHj(){
  var h=pick(HJ), t=ri(0,2);
  var others=HJ.filter(function(x){return x!==h;});
  var ex=h[0]+' ('+h[1]+') : '+h[2];
  if(t===0) return mc('한자 → 음','<span class="big">'+h[0]+'</span>의 음은?',h[1],others.map(function(x){return x[1];}),ex);
  if(t===1) return mc('성어 → 뜻','<span class="big">'+h[0]+'</span>'+h[1]+'의 뜻은?',h[2],others.map(function(x){return x[2];}),ex);
  return mc('뜻 → 성어','"'+h[2]+'"을 뜻하는 성어는?',h[1]+' '+h[0],others.map(function(x){return x[1]+' '+x[0];}),ex);
}

var SUBJ={
  '수학':{gen:genMath,note:'대수·미적분Ⅰ 계산'},
  '영어':{gen:genEn,note:'수능 어휘 '+EN.length+'개',cards:EN.map(function(w){return {f:w[0],b:w[1]};})},
  '국어':{gen:genKo,note:'맞춤법·문법·문학 개념 '+KO.length+'문항'},
  '한자':{gen:genHj,note:'한자 성어 '+HJ.length+'개',cards:HJ.map(function(h){return {f:h[0],b:h[1]+'<br>'+h[2]};})}
};
var NAMES=Object.keys(SUBJ);

/* ---------- 기록 ---------- */
var KEY='dana-study-v1';
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
var EXAM_DEFAULT='2027-11-18';
function blank(){var s={wrong:[],score:{},day:{date:today(),n:0,c:0,todo:{}},plan:{},exam:EXAM_DEFAULT};NAMES.forEach(function(n){s.score[n]={n:0,c:0};});return s;}
function load(){
  var s=blank();
  try{
    var r=JSON.parse(localStorage.getItem(KEY));
    if(r&&r.score&&r.wrong){
      s.wrong=r.wrong;
      NAMES.forEach(function(n){if(r.score[n]) s.score[n]=r.score[n];});
      if(r.day&&r.day.date===today()){ s.day=r.day; if(!s.day.todo) s.day.todo={}; }
      if(r.plan) s.plan=r.plan;
      if(/^\d{4}-\d{2}-\d{2}$/.test(r.exam||'')) s.exam=r.exam;
    }
  }catch(e){}
  return s;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
var store=load();

/* ---------- 화면 ---------- */
var $=function(id){return document.getElementById(id);};
var cur={subj:NAMES[0],mode:'quiz',q:null,done:false,streak:0,card:0,flip:false,deck:null};

function wrongOf(s){return store.wrong.filter(function(w){return w.s===s;});}

function renderTabs(){
  $('tabs').innerHTML=NAMES.map(function(n){
    return '<button type="button" data-s="'+n+'" aria-pressed="'+(n===cur.subj)+'">'+n+'</button>';
  }).join('');
  var modes=[['quiz','문제 풀기']];
  if(SUBJ[cur.subj].cards) modes.push(['cards','카드 외우기']);
  modes.push(['wrong','오답 노트 '+wrongOf(cur.subj).length]);
  $('modes').innerHTML=modes.map(function(m){
    return '<button type="button" data-m="'+m[0]+'" aria-pressed="'+(m[0]===cur.mode)+'">'+m[1]+'</button>';
  }).join('');
}
function renderStats(){
  $('today').textContent='오늘 '+store.day.n+'문제 · 정답 '+store.day.c;
  $('stats').innerHTML=NAMES.map(function(n){
    var s=store.score[n], p=s.n?Math.round(s.c/s.n*100)+'%':'–';
    return '<div><strong>'+p+'</strong>'+n+' '+s.c+'/'+s.n+'</div>';
  }).join('');
}
function nextQ(){
  cur.done=false;
  if(cur.mode==='wrong'){
    var list=wrongOf(cur.subj);
    cur.q=list.length?pick(list.length>1?list.filter(function(w){return w!==cur.q;}):list):null;
  }else{
    cur.q=SUBJ[cur.subj].gen();
  }
  renderPanel();
}
function renderPanel(){
  var p=$('panel');
  if(cur.mode==='cards'){
    var deck=cur.deck, c=deck[cur.card];
    p.innerHTML='<div class="meta"><span class="tag">'+SUBJ[cur.subj].note+'</span><span>'+(cur.card+1)+' / '+deck.length+'</span></div>'+
      '<div class="flash" id="flash" role="button" tabindex="0"><div class="front">'+c.f+'</div>'+
      (cur.flip?'<div class="back">'+c.b+'</div>':'<div class="hint">눌러서 뜻 보기</div>')+'</div>'+
      '<div class="row"><button type="button" data-c="prev">이전</button><button type="button" data-c="mix">섞기</button><button type="button" data-c="next">다음</button></div>';
    return;
  }
  var q=cur.q;
  if(!q){
    p.innerHTML='<div class="empty">'+cur.subj+' 오답 노트가 비어 있습니다.<br>틀린 문제가 여기에 모입니다.</div>';
    return;
  }
  var h='<div class="meta"><span class="tag">'+q.tag+'</span><span>'+(cur.mode==='wrong'?'맞히면 노트에서 지워집니다':'연속 정답 '+cur.streak)+'</span></div>'+
    '<p class="q">'+q.q+'</p><div class="choices">';
  q.choices.forEach(function(c,i){
    var cls='';
    if(cur.done){ if(i===q.a) cls='ok'; else if(i===cur.sel) cls='no'; }
    h+='<button type="button" data-i="'+i+'" class="'+cls+'"'+(cur.done?' disabled':'')+'>'+c+'</button>';
  });
  h+='</div>';
  if(cur.done){
    h+='<div class="explain"><b>'+(cur.sel===q.a?'정답!':'오답')+'</b> '+q.ex+'</div>'+
       '<button type="button" class="next" id="next">다음 문제</button>';
  }
  p.innerHTML=h;
  if(cur.done) $('next').focus();
}
function answer(i){
  if(cur.done||!cur.q) return;
  var q=cur.q, ok=(i===q.a);
  cur.sel=i; cur.done=true;
  store.day.n++; store.score[cur.subj].n++;
  if(ok){ store.day.c++; store.score[cur.subj].c++; cur.streak++; }
  else cur.streak=0;
  if(cur.mode==='wrong'){
    if(ok) store.wrong=store.wrong.filter(function(w){return w!==q;});
  }else if(!ok){
    var dup=store.wrong.some(function(w){return w.s===cur.subj&&w.q===q.q;});
    if(!dup){
      store.wrong.push({s:cur.subj,tag:q.tag,q:q.q,choices:q.choices,a:q.a,ex:q.ex});
      if(store.wrong.length>200) store.wrong.shift();
    }
  }
  save(); renderTabs(); renderStats(); renderPanel();
}
function setMode(m){
  cur.mode=m; cur.streak=0;
  if(m==='cards'){ cur.deck=SUBJ[cur.subj].cards.slice(); cur.card=0; cur.flip=false; renderTabs(); renderPanel(); }
  else { cur.q=null; renderTabs(); nextQ(); }
}

$('tabs').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  cur.subj=b.dataset.s; setMode('quiz');
});
$('modes').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  setMode(b.dataset.m);
});
$('panel').addEventListener('click',function(e){
  var b=e.target.closest('button');
  if(b&&b.dataset.i!==undefined){ answer(+b.dataset.i); return; }
  if(b&&b.id==='next'){ nextQ(); return; }
  if(b&&b.dataset.c){
    var n=cur.deck.length;
    if(b.dataset.c==='next') cur.card=(cur.card+1)%n;
    if(b.dataset.c==='prev') cur.card=(cur.card+n-1)%n;
    if(b.dataset.c==='mix'){ cur.deck=shuffle(cur.deck); cur.card=0; }
    cur.flip=false; renderPanel(); return;
  }
  if(e.target.closest('#flash')){ cur.flip=!cur.flip; renderPanel(); }
});
document.addEventListener('keydown',function(e){
  if($('study').hidden) return;
  if(cur.mode==='cards'){
    if(e.key===' '||e.key==='Enter'){ if(document.activeElement&&document.activeElement.tagName==='BUTTON') return; e.preventDefault(); cur.flip=!cur.flip; renderPanel(); }
    return;
  }
  if(!cur.done&&cur.q&&e.key>='1'&&e.key<=String(cur.q.choices.length)) answer(+e.key-1);
});
$('reset').addEventListener('click',function(){
  if(confirm('점수와 오답 노트를 모두 지울까요? (계획표 체크는 그대로 둡니다)')){ var b=blank(); b.plan=store.plan; b.exam=store.exam; b.day.todo=store.day.todo; store=b; save(); setMode('quiz'); renderStats(); }
});

function toDate(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function day0(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function diff(a,b){return Math.round((a-b)/86400000);}
function rel(s){ if(s.charAt(0)!=='E') return toDate(s); var d=toDate(store.exam); d.setDate(d.getDate()-(+s.slice(2))); return d; }
function md(d){return d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate();}
var view='plan', openPhase=null;

function renderDday(){
  var ex=toDate(store.exam), t=day0(), left=diff(ex,t);
  var total=Math.max(1,diff(ex,toDate(START))), passed=Math.min(total,Math.max(0,diff(t,toDate(START))));
  var wk=['일','월','화','수','목','금','토'][ex.getDay()];
  var d=left>0?'D-'+left:(left===0?'D-DAY':'D+'+(-left));
  $('dday').innerHTML='<div class="top"><div class="d">'+d+'</div><div class="lbl">2028학년도 수능<br>'+md(ex)+' ('+wk+')</div></div>'+
    '<div class="bar"><i style="width:'+(passed/total*100).toFixed(1)+'%"></i></div>'+
    '<div class="sub"><span>'+(left>0?Math.floor(left/7)+'주 '+(left%7)+'일 남음':'수고했어요')+'</span><span>'+Math.round(passed/total*100)+'% 지남</span></div>';
}
function renderViews(){
  $('views').innerHTML=[['plan','계획표'],['study','문제 풀기']].map(function(v){
    return '<button type="button" data-v="'+v[0]+'" aria-pressed="'+(v[0]===view)+'">'+v[1]+'</button>';
  }).join('');
  $('plan').hidden=view!=='plan'; $('study').hidden=view!=='study';
}
function renderPlan(){
  var t=day0(), h='';
  var dn=DAILY.filter(function(x,i){return store.day.todo[i];}).length;
  h+='<div class="box"><div class="head" style="cursor:default"><div><h2>오늘 할 일</h2><div class="when">매일 새로 시작</div></div><div class="cnt">'+dn+' / '+DAILY.length+'</div></div><ul class="todo">'+
    DAILY.map(function(x,i){return '<li><label><input type="checkbox" data-d="'+i+'"'+(store.day.todo[i]?' checked':'')+'><span>'+x+'</span></label></li>';}).join('')+'</ul></div>';
  PHASES.forEach(function(p,i){
    var s=rel(p[1]), e=rel(p[2]);
    var st=t<s?'later':(t>e?'past':'now');
    var open=openPhase===null?st==='now':openPhase===i;
    var done=p[4].filter(function(x,j){return store.plan[i+'-'+j];}).length;
    var dTo=diff(toDate(store.exam),s);
    h+='<div class="box '+st+'"><div class="head" data-p="'+i+'" role="button" tabindex="0" aria-expanded="'+open+'"><div><h2>'+(i+1)+'. '+p[0]+(st==='now'?'<span class="badge">지금</span>':'')+'</h2>'+
      '<div class="when">'+md(s)+' ~ '+md(e)+' · D-'+dTo+'부터</div></div><div class="cnt">'+done+' / '+p[4].length+'</div></div>';
    if(open){
      h+='<p class="goal">'+p[3]+'</p><ul class="todo">'+p[4].map(function(x,j){
        var id=i+'-'+j;
        return '<li><label><input type="checkbox" data-t="'+id+'"'+(store.plan[id]?' checked':'')+'><span><b>'+x[0]+'</b> '+x[1]+'</span></label></li>';
      }).join('')+'</ul>';
    }
    h+='</div>';
  });
  h+='<div class="examset">수능 날짜는 예년처럼 11월 셋째 주 목요일로 넣어 두었습니다. 공지된 날짜와 다르면 바꾸세요. 모의고사·원서 접수 날짜도 학교 공지로 확인하세요.<br>'+
     '<label>수능 날짜 <input type="date" id="exam" value="'+store.exam+'"></label></div>';
  $('plan').innerHTML=h;
}
$('views').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  view=b.dataset.v; renderViews();
});
$('plan').addEventListener('click',function(e){
  var hd=e.target.closest('.head[data-p]'); if(!hd) return;
  var i=+hd.dataset.p, isOpen=hd.getAttribute('aria-expanded')==='true';
  openPhase=isOpen?-1:i; renderPlan();
});
$('plan').addEventListener('keydown',function(e){
  var hd=e.target.closest('.head[data-p]');
  if(hd&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); hd.click(); }
});
$('plan').addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.t){ if(t.checked) store.plan[t.dataset.t]=1; else delete store.plan[t.dataset.t]; }
  else if(t.dataset.d){ if(t.checked) store.day.todo[t.dataset.d]=1; else delete store.day.todo[t.dataset.d]; }
  else if(t.id==='exam'){ if(!/^\d{4}-\d{2}-\d{2}$/.test(t.value)) return; store.exam=t.value; renderDday(); }
  save(); renderPlan();
});

renderDday(); renderViews(); renderPlan();
renderStats(); setMode('quiz');
})();
