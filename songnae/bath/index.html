<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 집 욕실 꾸며 보기 | (주)하론이앤씨</title>
<style>
  :root { color-scheme: light; --bg:#f3f1ec; --paper:#fffdf8; --card:#fff; --ink:#1f2630; --sub:#68707b; --line:#dcd8cf; --main:#1f5fa8; --main2:#e8f0fa; --gold:#9a6f12; --gold2:#fbf2dc; --red:#b33a2b; --dim:#3d6ea8; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  body { padding-left:max(12px, env(safe-area-inset-left, 0px)); padding-right:max(12px, env(safe-area-inset-right, 0px)); padding-block:12px 40px; }
  button { font-family:inherit; color:inherit; }
  .top { max-width:1280px; margin:0 auto 10px; display:flex; flex-wrap:wrap; gap:6px 16px; align-items:flex-end; justify-content:space-between; }
  .top h1 { margin:0; font-size:22px; letter-spacing:-.3px; text-wrap:balance; }
  .top .sub { color:var(--sub); font-size:13.5px; margin-top:2px; }
  .top .brand { font-size:12.5px; color:var(--sub); letter-spacing:.5px; }
  .bar { max-width:1280px; margin:0 auto 10px; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .bar .row { flex-wrap:nowrap; min-width:0; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .row > b { font-size:13px; color:var(--sub); font-weight:600; min-width:54px; }
  .scrollrow { display:flex; gap:6px; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; padding-bottom:2px; }
  .scrollrow::-webkit-scrollbar { display:none; }
  .btn { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:7px 13px; font-size:14px; cursor:pointer; white-space:nowrap; flex:none; }
  .btn.on { background:var(--main); color:#fff; border-color:var(--main); }
  .btn.big { border-radius:12px; padding:11px 16px; font-size:15.5px; font-weight:700; }
  .wrap { max-width:1280px; margin:0 auto; display:grid; grid-template-columns:minmax(0, 1.35fr) minmax(0, 1fr); gap:14px; align-items:start; }
  @media (max-width: 900px) { .wrap { grid-template-columns:minmax(0, 1fr); } }
  .faces { background:var(--paper); border:1px solid var(--line); border-radius:16px; overflow:hidden; position:sticky; top:8px; }
  @media (max-width: 900px) { .faces { position:static; } }
  .tabs { display:flex; gap:4px; padding:8px; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:1 0 auto; border:0; background:none; padding:8px 10px; border-radius:10px; font-size:14px; cursor:pointer; color:var(--sub); white-space:nowrap; }
  .tab b { display:block; font-size:16px; color:var(--ink); }
  .tab.on { background:var(--main2); color:var(--main); } .tab.on b { color:var(--main); }
  .car { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .car::-webkit-scrollbar { display:none; }
  .face { flex:0 0 100%; scroll-snap-align:start; margin:0; padding:8px 10px 12px; min-width:0; }
  .face figcaption { display:flex; justify-content:space-between; gap:8px; font-size:13px; color:var(--sub); padding:2px 2px 6px; }
  .face figcaption b { color:var(--ink); font-size:15px; }
  .face svg { width:100%; height:auto; display:block; max-height:68vh; }
  .face svg [data-slot] { cursor:pointer; }
  .hint { font-size:12px; color:var(--sub); text-align:center; padding:0 10px 10px; }
  .warn { margin:0 10px 10px; background:#fff3ef; color:var(--red); border:1px solid #efc6bc; border-radius:10px; padding:7px 10px; font-size:13px; }
  .panel { display:flex; flex-direction:column; gap:12px; min-width:0; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; min-width:0; }
  .box h2 { margin:0 0 8px; font-size:16px; display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .box h2 small { font-weight:400; color:var(--sub); font-size:12.5px; }
  .mrow { display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:8px; align-items:center; padding:8px 4px; border-top:1px solid #eeebe4; cursor:pointer; background:none; border-left:0; border-right:0; border-bottom:0; width:100%; text-align:left; font-size:14px; }
  .mrow:first-of-type { border-top:0; }
  .mrow .no { width:24px; height:24px; border-radius:50%; background:var(--main); color:#fff; font-size:12.5px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .mrow .nm { min-width:0; } .mrow .nm small { display:block; color:var(--sub); font-size:12px; }
  .mrow .nm em { font-style:normal; font-weight:700; overflow-wrap:anywhere; }
  .mrow .pr { font-size:13px; text-align:right; white-space:nowrap; color:var(--sub); }
  .mrow .pr .chg { color:var(--main); font-weight:700; }
  .mrow.open { background:#f7f9fc; }
  .chip { display:inline-block; font-size:11px; padding:1px 6px; border-radius:6px; background:#eef1f4; color:var(--sub); margin-left:4px; vertical-align:1px; white-space:nowrap; }
  .chip.g { background:var(--gold2); color:var(--gold); } .chip.a { background:#f3efe6; color:#857252; }
  .pick { padding:6px 2px 10px; border-top:1px dashed var(--line); }
  .pick .flt { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:6px; }
  .pick .flt .btn { padding:4px 10px; font-size:12.5px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:6px; max-height:360px; overflow-y:auto; padding:2px; }
  .grid.wide { grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); }
  .op { border:2px solid transparent; background:#faf9f6; border-radius:10px; padding:5px; cursor:pointer; text-align:left; font-size:12px; line-height:1.3; display:flex; flex-direction:column; gap:3px; min-width:0; }
  .op.on { border-color:var(--main); background:var(--main2); }
  .op.off { opacity:.4; cursor:not-allowed; }
  .op img, .op .mini { width:100%; aspect-ratio:2/1; object-fit:cover; border-radius:6px; display:block; background:#fff; }
  .op.sq img { aspect-ratio:1; }
  .op .mini svg { width:100%; height:100%; display:block; }
  .op .ph { width:100%; aspect-ratio:4/3; object-fit:contain; background:#fff; border-radius:6px; }
  .op b { font-weight:600; overflow-wrap:anywhere; } .op span { color:var(--sub); font-size:11.5px; }
  .sum .big { font-size:28px; font-weight:800; color:var(--main); letter-spacing:-.5px; }
  .sum ul { margin:6px 0 0; padding-left:18px; font-size:13px; color:#3b434e; line-height:1.55; }
  .grade { display:inline-block; padding:2px 9px; border-radius:6px; font-size:13px; font-weight:700; }
  .note { font-size:12px; color:var(--sub); line-height:1.5; margin-top:6px; }
  input.who { flex:1; min-width:0; border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-size:15px; font-family:inherit; }
  .toast { position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); background:#1f2630; color:#fff; padding:9px 14px; border-radius:10px; font-size:13.5px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:calc(100% - 32px); }
  .toast.on { opacity:.94; }
</style>

<header class="top">
  <div><div class="brand">(주)하론이앤씨 · 송내주공1단지</div><h1 id="ttl">우리 집 욕실 꾸며 보기</h1><div class="sub" id="sub"></div></div>
  <button class="btn big on" id="sheet">확인서 만들기</button>
</header>
<section class="bar">
  <div class="row"><b>욕실</b><div class="scrollrow" id="rooms"></div></div>
  <div class="row"><b>기본 모양</b><button class="btn" data-preset="std">표준형으로 채우기</button><button class="btn" data-preset="gold">고급형으로 채우기</button></div>
</section>
<main class="wrap">
  <section class="faces">
    <nav class="tabs" id="tabs"></nav>
    <div class="car" id="car"></div>
    <div class="hint">옆으로 밀면 다음 면이 나옵니다 · 그림의 번호나 기구를 누르면 그 자재를 바꿀 수 있습니다</div>
    <div class="warn" id="warn" hidden></div>
  </section>
  <section class="panel">
    <div class="box"><h2><span id="matTtl">자재</span><small>누르면 바로 바뀜</small></h2><div id="mat"></div></div>
    <div class="box sum" id="sum"></div>
    <div class="box" id="saveBox">
      <h2>손님별 저장 <small>이 기기에만</small></h2>
      <div class="row"><input class="who" id="who" placeholder="예: 101동 1203호"><button class="btn" id="saveAs">저장</button></div>
      <div class="row" id="saved" style="margin-top:6px"></div>
      <div class="note">세대 이름을 붙여 저장해 두면 다음 상담 때 눌러서 그대로 불러옵니다. 같은 이름으로 저장하면 새 것으로 바뀝니다. 이 이름은 확인서에도 들어갑니다.</div>
    </div>
  </section>
</main>
