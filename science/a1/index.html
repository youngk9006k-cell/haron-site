let yaw=0,pit=0.15,fov=(innerWidth<innerHeight?100:75),auto=true;const Y0=yaw,P0=pit,F0=fov;
function size(){const r=Math.min(window.devicePixelRatio||1,2);cv.width=innerWidth*r;cv.height=innerHeight*r;gl.viewport(0,0,cv.width,cv.height);draw();}
function draw(){if(!ready)return;gl.uniform1f(U.yaw,yaw);gl.uniform1f(U.pit,pit);gl.uniform1f(U.tf,Math.tan(fov*Math.PI/360));gl.uniform1f(U.asp,cv.width/cv.height);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
function clampv(){pit=Math.max(-1.45,Math.min(1.45,pit));fov=Math.max(35,Math.min(100,fov));}
function stop(){auto=false;const h=document.getElementById('hint');h.style.opacity=0;}
const pts=new Map();let lastD=0;
cv.addEventListener('pointerdown',e=>{stop();cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.style.cursor='grabbing';});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const o=pts.get(e.pointerId);
 if(pts.size===1){const k=Math.tan(fov*Math.PI/360)*2/innerHeight;yaw-=(e.clientX-o.x)*k;pit+=(e.clientY-o.y)*k;}
 pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pts.size===2){const a=[...pts.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastD)fov*=lastD/d;lastD=d;}
 clampv();draw();});
function up(e){pts.delete(e.pointerId);lastD=0;cv.style.cursor='grab';}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();stop();fov*=Math.exp(e.deltaY*0.001);clampv();draw();},{passive:false});
addEventListener('keydown',e=>{const s=0.06;const m={ArrowLeft:[-s,0],ArrowRight:[s,0],ArrowUp:[0,s],ArrowDown:[0,-s]}[e.key];if(m){stop();yaw+=m[0];pit+=m[1];clampv();draw();}});
document.getElementById('reset').onclick=()=>{yaw=Y0;pit=P0;fov=F0;draw();};
(function tick(){if(auto){yaw+=0.0015;draw();}requestAnimationFrame(tick);})();
addEventListener('resize',size);size();
})();
</script></body></html>
